; The Sims Bustin' Out - PC (static recompilation) settings
; One NAME=VALUE per line. Delete a line (or put ; in front) to use the default.
; Real environment variables override anything here.

; Window size multiplier for the 640x480 picture (1-8)
RECOMP_WINDOW_SCALE=2

; Start fullscreen (1 = yes)
;RECOMP_FULLSCREEN=1

; Draw with your graphics card (Direct3D 11). 0 = the old software renderer,
; for a PC whose graphics card is too old for Direct3D 10/11 or misdraws
SIMS_GPU=1

; The F6 menu (in game) changes the next four and saves them here.
; Internal resolution: 1 = 640x480 (original), 2 = 1280x960, 3 = 1920x1440, 4 = 2560x1920
RECOMP_GPU_SCALE=1
; Frame-rate counter in the corner of the window
RECOMP_SHOW_FPS=0
; Save every texture once to textures\dump\ (PNG)
RECOMP_TEX_DUMP=0
; Use textures\replace\<same file name>.png instead of the original (any size)
RECOMP_TEX_REPLACE=0

; Smoother textures (bilinear filtering). 0 = sharp pixels
RECOMP_TEX_BILINEAR=1

; Print GPU statistics to sims_bustinout.log every few seconds
;RECOMP_GPU_STATS=1

; Original 4x supersampling (sharper, about 4x slower). 0 = off (default)
;SIMS_SUPERSAMPLE=1

; Use the keyboard as controller 1 when no gamepad is plugged in
RECOMP_KEYBOARD=1

; Where saves go (default: the "saves" folder next to the exe)
;RECOMP_SAVE_DIR=C:\Users\you\Documents\SimsBustinOut

; --- Troubleshooting (leave alone unless asked) ---
;RECOMP_WATCHDOG_SECS=30
;RECOMP_WAIT_LOG=1
